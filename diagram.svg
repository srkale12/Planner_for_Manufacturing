<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 858" width="1110" height="858" role="img" aria-label="Hourglass data flow diagram of a production planning system: eight input tables collect into a preparation step, pass through a four-step planning engine, and emerge as six sets of results feeding five screens plus an ERP.">
  <title>Manufacturing Planner — how the data flows</title>
  <style>
    .bg   { fill: #FFFFFF; }
    .b      { fill: #FFFFFF; stroke: #1E3A5F; stroke-width: 1.2; }
    .b-soft { fill: #EDF1F4; stroke: #D3DAE1; stroke-width: 1.2; }
    .b-key  { fill: #FFFFFF; stroke: #8C6516; stroke-width: 1.5; }
    .zone-magic { fill: #FAF3E4; stroke: #8C6516; stroke-width: 2.5; }
    .zone-app   { fill: #EDF1F4; stroke: #1E3A5F; stroke-width: 1.6; }
    .t   { font-family: Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #16202B; }
    .t-s { font-family: Helvetica, Arial, sans-serif; font-size: 11px;   font-weight: 700; fill: #16202B; }
    .s   { font-family: Georgia, serif; font-size: 9.5px;  fill: #55636F; }
    .s-m { font-family: Georgia, serif; font-size: 10.5px; fill: #55636F; }
    .lbl { font-family: "Courier New", monospace; font-size: 10px; fill: #55636F; }
    .cap { font-family: "Courier New", monospace; font-size: 10.5px; letter-spacing: 0.1em; fill: #55636F; }
    .cap-key { font-family: "Courier New", monospace; font-size: 10.5px; letter-spacing: 0.1em; fill: #8C6516; font-weight: 700; }
    .ttl { font-family: Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #1E3A5F; letter-spacing: -0.01em; }
    .ln  { stroke: #55636F; stroke-width: 1.3; fill: none; }
    .ln-dash { stroke: #8C6516; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .num-key { font-family: "Courier New", monospace; font-size: 11px; font-weight: 700; fill: #8C6516; }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55636F"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C6516"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1110" height="858"/>
  <text class="ttl" x="40" y="34">Manufacturing Planner — how the data flows</text>

  <g transform="translate(0,28)">

    <!-- BAND A — INPUTS -->
    <text class="cap" x="40" y="30">WHAT GOES IN  ·  ALL OF IT TAGGED BY SCENARIO, SO ONE CUSTOMER'S DATA NEVER MIXES WITH ANOTHER'S</text>

    <rect class="b-soft" x="40" y="46" width="118" height="58" rx="3"/>
    <text class="t-s" x="99" y="70" text-anchor="middle">Products</text>
    <text class="s" x="99" y="88" text-anchor="middle">what you make</text>

    <rect class="b-soft" x="170" y="46" width="118" height="58" rx="3"/>
    <text class="t-s" x="229" y="70" text-anchor="middle">On-hand stock</text>
    <text class="s" x="229" y="88" text-anchor="middle">what's in the warehouse</text>

    <rect class="b-soft" x="300" y="46" width="118" height="58" rx="3"/>
    <text class="t-s" x="359" y="70" text-anchor="middle">Safety stock</text>
    <text class="s" x="359" y="88" text-anchor="middle">the floor you hold</text>

    <rect class="b-soft" x="430" y="46" width="118" height="58" rx="3"/>
    <text class="t-s" x="489" y="70" text-anchor="middle">Line rates</text>
    <text class="s" x="489" y="88" text-anchor="middle">units per shift</text>

    <rect class="b-soft" x="560" y="46" width="118" height="58" rx="3"/>
    <text class="t-s" x="619" y="70" text-anchor="middle">Line capacity</text>
    <text class="s" x="619" y="88" text-anchor="middle">hours available per day</text>

    <rect class="b-soft" x="690" y="46" width="118" height="58" rx="3"/>
    <text class="t-s" x="749" y="70" text-anchor="middle">Changeover cost</text>
    <text class="s" x="749" y="88" text-anchor="middle">cost to switch product</text>

    <rect class="b-soft" x="820" y="46" width="118" height="58" rx="3"/>
    <text class="t-s" x="879" y="70" text-anchor="middle">Customer orders</text>
    <text class="s" x="879" y="88" text-anchor="middle">quantities and due dates</text>

    <rect class="b-soft" x="950" y="46" width="118" height="58" rx="3"/>
    <text class="t-s" x="1009" y="70" text-anchor="middle">Forecast</text>
    <text class="s" x="1009" y="88" text-anchor="middle">expected demand</text>

    <line class="ln" x1="99" y1="104" x2="99" y2="128"/>
    <line class="ln" x1="229" y1="104" x2="229" y2="128"/>
    <line class="ln" x1="359" y1="104" x2="359" y2="128"/>
    <line class="ln" x1="489" y1="104" x2="489" y2="128"/>
    <line class="ln" x1="619" y1="104" x2="619" y2="128"/>
    <line class="ln" x1="749" y1="104" x2="749" y2="128"/>
    <line class="ln" x1="879" y1="104" x2="879" y2="128"/>
    <line class="ln" x1="1009" y1="104" x2="1009" y2="128"/>
    <line class="ln" x1="99" y1="128" x2="1009" y2="128"/>
    <line class="ln" x1="555" y1="128" x2="555" y2="146" marker-end="url(#ar)"/>

    <!-- BAND B — PREP -->
    <rect class="b" x="285" y="150" width="540" height="52" rx="3"/>
    <text class="t" x="555" y="173" text-anchor="middle">Get it ready</text>
    <text class="s-m" x="555" y="191" text-anchor="middle">turn orders into weekly demand · turn capacity into available shifts · lock the near term</text>

    <line class="ln" x1="555" y1="202" x2="555" y2="228" marker-end="url(#ar)"/>

    <!-- BAND C — THE ENGINE -->
    <rect class="zone-magic" x="180" y="232" width="750" height="268" rx="4"/>
    <text class="cap-key" x="200" y="256">WHERE THE DECISION IS MADE  ·  60 TO 120 SECONDS</text>

    <rect class="b-key" x="205" y="270" width="700" height="48" rx="3"/>
    <text class="num-key" x="222" y="291">01</text>
    <text class="t" x="252" y="291">Decide how much to make each week</text>
    <text class="s-m" x="252" y="308">weighing order fulfilment, safety-stock cover, inventory held and shifts used</text>

    <rect class="b-key" x="205" y="326" width="700" height="48" rx="3"/>
    <text class="num-key" x="222" y="347">02</text>
    <text class="t" x="252" y="347">Lay it out across the days</text>
    <text class="s-m" x="252" y="364">order products so similar recipes run back to back and lines wash out less</text>

    <rect class="b-key" x="205" y="382" width="700" height="48" rx="3"/>
    <text class="num-key" x="222" y="403">03</text>
    <text class="t" x="252" y="403">Make it realistic</text>
    <text class="s-m" x="252" y="420">whole batches only · respect each day's limit · keep product families together</text>

    <rect class="b-key" x="205" y="438" width="700" height="48" rx="3"/>
    <text class="num-key" x="222" y="459">04</text>
    <text class="t" x="252" y="459">Use up what's left</text>
    <text class="s-m" x="252" y="476">any idle capacity goes to building buffer stock, up to each product's ceiling</text>

    <rect class="b-soft" x="950" y="330" width="145" height="58" rx="3"/>
    <text class="t-s" x="1022" y="354" text-anchor="middle">Planner tuning</text>
    <text class="s" x="1022" y="372" text-anchor="middle">the rules you set</text>
    <line class="ln" x1="948" y1="359" x2="936" y2="359" marker-end="url(#ar)"/>

    <path class="ln-dash" d="M 36 567 L 16 567 L 16 400 L 174 400" marker-end="url(#arb)"/>
    <text class="lbl" x="98" y="392" text-anchor="middle">the agreed plan</text>

    <line class="ln" x1="555" y1="500" x2="555" y2="532" marker-end="url(#ar)"/>

    <!-- BAND D — OUTPUTS -->
    <text class="cap" x="40" y="527">WHAT COMES OUT</text>

    <rect class="b" x="40" y="540" width="160" height="54" rx="3"/>
    <text class="t-s" x="120" y="563" text-anchor="middle">The schedule</text>
    <text class="s" x="120" y="580" text-anchor="middle">line · week · day · qty</text>

    <rect class="b" x="212" y="540" width="160" height="54" rx="3"/>
    <text class="t-s" x="292" y="563" text-anchor="middle">Inventory outlook</text>
    <text class="s" x="292" y="580" text-anchor="middle">stock vs safety stock</text>

    <rect class="b" x="384" y="540" width="160" height="54" rx="3"/>
    <text class="t-s" x="464" y="563" text-anchor="middle">Capacity use</text>
    <text class="s" x="464" y="580" text-anchor="middle">shifts used vs available</text>

    <rect class="b" x="556" y="540" width="160" height="54" rx="3"/>
    <text class="t-s" x="636" y="563" text-anchor="middle">Order shortages</text>
    <text class="s" x="636" y="580" text-anchor="middle">which orders fall short</text>

    <rect class="b" x="728" y="540" width="160" height="54" rx="3"/>
    <text class="t-s" x="808" y="563" text-anchor="middle">Changeover count</text>
    <text class="s" x="808" y="580" text-anchor="middle">washouts per line</text>

    <rect class="b" x="900" y="540" width="160" height="54" rx="3"/>
    <text class="t-s" x="980" y="563" text-anchor="middle">Audit + snapshot</text>
    <text class="s" x="980" y="580" text-anchor="middle">who ran it, what it said</text>

    <line class="ln" x1="120" y1="594" x2="120" y2="636" marker-end="url(#ar)"/>
    <line class="ln" x1="292" y1="594" x2="292" y2="636" marker-end="url(#ar)"/>
    <line class="ln" x1="464" y1="594" x2="464" y2="636" marker-end="url(#ar)"/>
    <line class="ln" x1="636" y1="594" x2="636" y2="636" marker-end="url(#ar)"/>
    <line class="ln" x1="808" y1="594" x2="808" y2="636" marker-end="url(#ar)"/>
    <line class="ln" x1="980" y1="594" x2="980" y2="686" marker-end="url(#ar)"/>

    <!-- BAND E — WHERE YOU SEE IT -->
    <text class="cap" x="40" y="622">WHERE YOU SEE IT</text>

    <rect class="zone-app" x="40" y="640" width="800" height="150" rx="4"/>

    <rect class="b" x="60" y="662" width="760" height="32" rx="2"/>
    <text class="s-m" x="440" y="683" text-anchor="middle">KPI bar  ·  avg weeks of supply  ·  % above safety stock  ·  utilisation  ·  backorders  ·  changeovers</text>

    <rect class="b" x="60" y="712" width="145" height="52" rx="2"/>
    <text class="t-s" x="132" y="735" text-anchor="middle">Schedule</text>
    <text class="s" x="132" y="752" text-anchor="middle">the Gantt chart</text>

    <rect class="b" x="214" y="712" width="145" height="52" rx="2"/>
    <text class="t-s" x="286" y="735" text-anchor="middle">Inventory</text>
    <text class="s" x="286" y="752" text-anchor="middle">stock &amp; shortages</text>

    <rect class="b" x="368" y="712" width="145" height="52" rx="2"/>
    <text class="t-s" x="440" y="735" text-anchor="middle">Capacity</text>
    <text class="s" x="440" y="752" text-anchor="middle">line utilisation</text>

    <rect class="b" x="522" y="712" width="145" height="52" rx="2"/>
    <text class="t-s" x="594" y="735" text-anchor="middle">Changeovers</text>
    <text class="s" x="594" y="752" text-anchor="middle">washouts by week</text>

    <rect class="b" x="676" y="712" width="145" height="52" rx="2"/>
    <text class="t-s" x="748" y="735" text-anchor="middle">Data &amp; Tuning</text>
    <text class="s" x="748" y="752" text-anchor="middle">inputs &amp; the rules</text>

    <rect class="b-soft" x="890" y="686" width="180" height="68" rx="3"/>
    <text class="t-s" x="980" y="712" text-anchor="middle">The ERP</text>
    <text class="s" x="980" y="729" text-anchor="middle">arrives as proposals</text>
    <text class="s" x="980" y="744" text-anchor="middle">a human approves</text>

  </g>
</svg>
